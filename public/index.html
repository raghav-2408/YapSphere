<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="logo1.png" type="image/x-icon" />
    <script
      src="https://kit.fontawesome.com/66fed9d98a.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>YapSphere - Sign In</title>
    <style>
      body {
        background-color: #e5e5e5;
      }
      .container {
        box-shadow: 0px 0px 20px 3px #c2c1c1;
        width: 450px;
        position: relative;
        top: 85px;
        padding: 10px;
        background-color: white;
        border-radius: 15px;
      }
      h2 {
        text-align: center;
      }
      #welcome {
        font-variant: all-petite-caps;
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 2px;
        text-align: center;
      }
      .container button {
        width: 100%;
        background-color: #060694;
        color: white;
      }
      .container button:hover {
        background-color: #3b3b99;
      }
      #smile {
        font-size: 30px;
        color: #060694;
      }
      #rocket {
        color: royalblue;
      }
      input[type="email"],
      input[type="password"] {
        padding: 6px;
        border: 2px solid #ccc;
        border-radius: 7px;
        font-size: 16px;
      }
      #footer {
        font-size: 13px;
      }
      /* Responsive Styling */
      @media (max-width: 768px) {
        .container {
          width: 95%;
          padding: 15px;
        }
        h2 {
          font-size: 1.5rem;
        }
      }
      @media (max-width: 576px) {
        #smile {
          font-size: 25px;
        }
        #welcome {
          font-size: 18px;
        }
      }
      /* Preloader Spinner Styling */
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .fade-out {
        opacity: 0;
        transition: opacity 0.5s ease;
      }
    </style>
  </head>
  <body>
    <!-- Preloader Spinner -->
    <div id="preloader">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="container" style="display: none;">
      <p id="welcome">Welcome back</p>
      <center>
        <i class="fa-regular fa-face-laugh" id="smile"></i>
      </center>
      <h2 class="my-1">Sign In to Your Account</h2>
      <p class="my-2">You're in! Let’s get you straight into the convo.</p>
      <p>
        — Yapsphere’s waiting.
        <i class="mx-1 fa-solid fa-rocket" id="rocket"></i>
      </p>
      <form action="/login" method="POST" class="my-3">
        <div class="mb-3">
          <i class="fa-regular fa-envelope mx-2"></i>
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            required
            placeholder="e.g. yourname@example.com"
          />
        </div>
        <div class="mb-3">
          <i class="fa-solid fa-lock mx-2"></i>
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            required
          />
        </div>
        <button type="submit" class="btn">
          Sign In
          <i class="fa-solid fa-right-to-bracket mx-2"></i>
        </button>
      </form>
      <p class="mt-3" id="footer">
        Don't have an account? <a href="/register">Sign up and get started!</a>
      </p>
    </div>

    <script>
      // Preloader Script
      window.addEventListener("load", () => {
        setTimeout(() => {
          document.getElementById("preloader").classList.add("fade-out");
          setTimeout(() => {
            document.getElementById("preloader").style.display = "none";
            document.getElementById("main-content").style.display = "block";
          }, 500); // Adjust this delay to match the fade-out animation
        }, 1000); // Simulated delay to show preloader effect
      });
    </script>
  </body>
</html>
